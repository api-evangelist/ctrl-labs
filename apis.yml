name: CTRL-labs *
description: 'CTRL-labs was a neurotechnology company founded in 2015 in New York City (originally
  Cognescent) by Thomas Reardon, Patrick Kaifosh, and Tim Machado, building a non-invasive neural
  interface: a wrist-worn band that reads surface electromyography (sEMG) signals from motor neurons
  to decode intended hand and finger movements for human-computer interaction. Its developer hardware
  was the CTRL-kit, and it acquired the Myo armband patents from North. In fall 2019 CTRL-labs was
  acquired by Facebook and folded into Facebook (now Meta) Reality Labs, where the technology became
  the basis of Meta''s neuromotor wristband for AR glasses (detailed in a July 2025 Nature paper).
  The company no longer operates as an independent entity and publishes no public API, SDK, or developer
  platform; this record is retained as an acquired-company lead.'
